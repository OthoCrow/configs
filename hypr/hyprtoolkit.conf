# --- Color Palette (ARGB Hex Format) ---

# Main background color for windows and panels
background = 0xFF181818

# Primary container base color (e.g., input fields, list items)
base = 0xFF202020

# Secondary or alternating container background color
alternate_base = 0xFF272727

# Standard body text color
text = 0xFFDADADA

# Text color for highlighted, active, or high-contrast elements
bright_text = 0xFFFFDEDE

# Primary accent color (used for borders, active focuses, etc.)
accent = 0xFF33CCEE

# Secondary accent color for gradients or lesser-prioritized focuses
accent_secondary = 0xFF33CCFF

# Corner rounding radius for windows and internal elements
rounding_large = 10
rounding_small = 5

